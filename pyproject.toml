[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chargegrid-intelligence"
version = "0.1.0"
description = "Chatbot gerencial para operações de recarga GoodWe"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "gradio>=6.0,<7.0",
    "langchain>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
    "langchain-classic>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-chroma>=1.0,<2.0",
    "chromadb>=1.0,<2.0",
    "pymupdf>=1.26,<2.0",
    "filelock>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "plotly>=6.0,<7.0",
    "tiktoken>=0.10,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<1.0",
]

reports = [
    "reportlab>=4.0,<6.0",
]

eval = [
    "ragas==0.4.3",
    "langchain-community==0.4.1",
]

notebook = [
    "ipykernel>=6.0,<8.0",
    "jupyterlab>=4.0,<5.0",
]

[project.scripts]
chargegrid = "chargegrid.cli:main"
chargegrid-web = "chargegrid.app:main"
chargegrid-rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
